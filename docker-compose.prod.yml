version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: shiksha-db-prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-shiksha_ai}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    restart: always

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: shiksha-api-prod
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_secure_pass}@postgres:5432/${POSTGRES_DB:-shiksha_ai}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      - postgres
    restart: always

  nginx:
    image: nginx:alpine
    container_name: shiksha-nginx-prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - api
    restart: always

volumes:
  pgdata_prod:
